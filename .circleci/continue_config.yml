version: 2.1

# the default pipeline parameters, which will be updated according to
# the results of the path-filtering orb
parameters:
  run-build-service-1-job:
    type: boolean
    default: false
  run-build-service-2-job:
    type: boolean
    default: false
  run-all-build-deploy-jobs:
    type: boolean
    default: false

jobs:
  build:
    docker:
      - image: circleci/golang:1.16
    parameters:
      environment:
        type: string
        default: dev  
      service:
        type: string
        default: ""
    steps:
      - run: echo "i build?"
      - run: echo << parameters.environment >>
      - run: echo << parameters.service >>
  deploy:
    docker:
      - image: circleci/golang:1.16
    parameters:
      environment:
        type: string
        default: dev  
      service:
        type: string
        default: ""
    steps:
      - run: echo "i deploy?"
      - run: echo << parameters.environment >>
      - run: echo << parameters.service >>


# here we specify our workflows, most of which are conditionally
# executed based upon pipeline parameter values. Each workflow calls a
# specific job defined above, in the jobs section.
workflows:
  # when pipeline parameter, run-build-service-1-job is true, the
  # build-service-1 job is triggered.
  build-service1:
    when:
      condition:
        or:
          - equal: [ true, << pipeline.parameters.run-build-service-1-job >> ] 
          - equal: [ true, << pipeline.parameters.run-all-build-deploy-jobs >> ]
    jobs:
      - build:
          # parameters
          environment: dev
          service: service1

          name: build-dev-service1
      - hold-deploy-dev:
          type: approval
          requires: build
      - deploy:
          environment: dev
          service: service1

          name: deploy-dev-service1
          requires: hold-deploy-dev
      - build:
          filters:
            branches:
              only:
                - main
          # parameters
          environment: prod
          service: service1

          name: build-prod-service1
      - hold-deploy-prod:
          type: approval
          requires: build
      - deploy:
          environment: prod
          service: service1

          requires: hold-deploy-prod
          name: deploy-prod-service1



  build-service2:
    when:
      condition:
        or:
          - equal: [ true, << pipeline.parameters.run-build-service-2-job >> ] 
          - equal: [ true, << pipeline.parameters.run-all-build-deploy-jobs >> ]
    jobs:
      - build:
          service: service2
            