version: 2.1

# the default pipeline parameters, which will be updated according to
# the results of the path-filtering orb
parameters:
  run-build-service-1-job:
    type: boolean
    default: false
  run-build-service-2-job:
    type: boolean
    default: false
  run-all-build-deploy-jobs:
    type: boolean
    default: true

jobs:
  build:
    docker:
      - image: circleci/golang:1.16
    environment:
      STACK="devvv"  
    parameters:
      environment:
        type: string
        default: dev  
      service:
        type: string
        default: ""
    steps:
      - run: echo "i start build"
      - when:
          condition:
            equal: [ prod, << parameters.environment >> ]
          steps:
            - run:
                name: update stack
                command: |
                  echo 'export STACK=prod' >> "$BASH_ENV"
                  source "$BASH_ENV"  
      - run: echo << parameters.environment >>
      - run: echo << parameters.service >>
      - run: echo $STACK
      - run: echo "cmd/<< parameters.service >>/config.<< parameters.environment >>.json"
      - run:
          name: prepare dir
          command: |
            mkdir -p /tmp/ci
            touch /tmp/ci/templates
            chmod 755 /tmp/ci/templates
      - run: echo "templateID" >> /tmp/ci/templates
      - persist_to_workspace:
          root: /tmp/ci
          paths:
            - templates
      - store_artifacts:
          path: /tmp/ci/templates
          destination: created-instance-templates
      - run: cat /tmp/ci/templates    
  deploy:
    docker:
      - image: circleci/golang:1.16
    parameters:
      environment:
        type: string
        default: dev  
      service:
        type: string
        default: ""
    steps:
      - run: echo "i deploy?"
      - run: echo << parameters.environment >>
      - run: echo << parameters.service >>
      - attach_workspace:
          at: /tmp/ci
      - run:
          name: stuff
          command: cat /tmp/ci/templates



# here we specify our workflows, most of which are conditionally
# executed based upon pipeline parameter values. Each workflow calls a
# specific job defined above, in the jobs section.
workflows:

  # when pipeline parameter, run-build-service-1-job is true, the
  # build-service-1 job is triggered.
  build-service1:
    environment:
      TEST_ENV="before_changed"
    when:
      or:
        - << pipeline.parameters.run-build-service-1-job >>
        - << pipeline.parameters.run-all-build-deploy-jobs >>
    jobs:
      - build:
          # parameters
          environment: dev
          service: service1

          name: build-dev-service1
      - hold-deploy-dev:
          type: approval

          requires:
            - build-dev-service1
      - deploy:
          environment: dev
          service: service1

          name: deploy-dev-service1
          requires:
            - hold-deploy-dev
      - build:
          filters:
            branches:
              only:
                - main
          # parameters
          environment: prod
          service: service1

          name: build-prod-service1
      - hold-deploy-prod:
          type: approval
          requires:
            - build-prod-service1

      - deploy:
          environment: prod
          service: service1

          requires:
            - hold-deploy-prod
          name: deploy-prod-service1
  build-service2:
    when:
      condition:
        or:
          - equal: [ true, << pipeline.parameters.run-build-service-2-job >> ] 
          - equal: [ true, << pipeline.parameters.run-all-build-deploy-jobs >> ]
    jobs:
      - build:
          # parameters
          environment: dev
          service: service2

          name: build-dev-service2
      - hold-deploy-dev:
          type: approval

          requires:
            - build-dev-service2
      - deploy:
          environment: dev
          service: service2

          name: deploy-dev-service2
          requires:
            - hold-deploy-dev
      - build:
          filters:
            branches:
              only:
                - main
          # parameters
          environment: prod
          service: service2

          name: build-prod-service2
      - hold-deploy-prod:
          type: approval
          requires:
            - build-prod-service2

      - deploy:
          environment: prod
          service: service2

          requires:
            - hold-deploy-prod
          name: deploy-prod-service2


