version: 2.1
jobs:
  build:
    docker:
      - image: circleci/golang:1.16
    steps:
      - checkout
      - run:
          name: build templates
          command: make build-templates
          working_directory: ./test/ci
      - run:
          name: echo path
          command: echo $PATH
      - run:
          name: update path
          command: echo 'export PATH=$(pwd):$PATH' >> "$BASH_ENV"
      - run:
          name: echo path
          command: echo $PATH
  test:
    docker:
      - image: circleci/golang:1.16
    steps:
      - run:
          name: file exists
          command: cat /tmp/ci/test
      - run:
          name: echo path
          command: echo $PATH
                
  
workflows:
  test:
    jobs:
      - build:
          context:
            - shared
      - hold-test:
          type: approval
          requires:
            - build      
      - test:
          requires:
            - hold-test
          context:
            - shared
