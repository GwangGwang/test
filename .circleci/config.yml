version: 2.1
jobs:
  build:
    docker:
      - image: circleci/golang:1.16
    steps:      
      - setup_remote_docker:
          version: 20.10.2
          docker_layer_caching: true
      - checkout
      - run:
          name: build templates
          command: make build-templates
          working_directory: ./test/ci
      - run: docker version
      - run: docker buildx build --help
      
      - run:
          name: docker build
          command: docker buildx build Dockerfile --platform linux/amd64
          
  test:
    docker:
      - image: circleci/golang:1.16
    steps:
      - run:
          name: file exists
          command: cat /tmp/ci/test
      - run:
          name: echo path
          command: echo $PATH
                
  
workflows:
  test:
    jobs:
      - build:
          context:
            - shared
      - hold-test:
          type: approval
          requires:
            - build      
      - test:
          requires:
            - hold-test
          context:
            - shared
