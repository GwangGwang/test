version: 2.1

orbs:
  continuation: circleci/continuation@0.5.0

jobs:
  update-pipeline-parameters:
    docker:
      - image: cimg/base:2023.03
    steps:
      - run:
          name: Set pipeline parameters
          command: echo '{"run-tests": false}' > pipeline-parameters.json
      - continuation/continue:
          parameters_file: pipeline-parameters.json
          configuration_path: .circleci/continue_config.yml  

workflows:
  setup:
    jobs:
      - update-pipeline-parameters
