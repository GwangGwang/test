version: 2.1

# Define the jobs we want to run for this project
jobs:
  build:
    docker:
      - image: cimg/base:2023.03
    steps:
      - checkout
      - run: echo "this is the build job"
  test:
    docker:
      - image: cimg/base:2023.03
    steps:
      - checkout
      - run:
          name: echo "this is the test job"
          command: |
            # Current version via self-updating btctl grabbing the latest version
            CURRENT_VERSION=btctl-v1.0.0
            echo "Current btctl release version: $CURRENT_VERSION"
            
            # Extract the version part and split to major/minor/patch
            VERSION_PART=$(echo "$CURRENT_VERSION" | sed "s/^btctl-v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/")
            echo $VERSION_PART
            IFS='.' read -r MAJOR MINOR PATCH \<<< "$(echo "$VERSION_PART")"
            
            # Increment the minor version
            MINOR_NEW=$((MINOR + 1))
            
            # Save the new version
            echo "export BTCTL_VERSION=btctl-v$MAJOR.$MINOR_NEW.$PATCH" >> $BASH_ENV
            source $BASH_ENV
            echo "New version to use: $BTCTL_VERSION"
      - run: echo $BTCTL_VERSION       

# Orchestrate our job run sequence
workflows:
  build_and_test:
    jobs:
      - build
      - test
