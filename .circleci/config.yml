version: 2.1
jobs:
  build:
    docker:
      - image: cimg/go:1.21.3
    steps:
      - checkout
      - run:
          name: Install Dagger CLI
          command: cd /usr/local && { curl -L https://dl.dagger.io/dagger/install.sh | sudo sh; cd -; }
      - run:
          name: Install Dependencies
          command: dagger run --progress plain go run ci/main.go --actions install
      - run:
          name: Tests
          command: dagger run --progress plain go run ci/main.go --actions vet,test
      - run:
          name: Build
          command: dagger run --progress plain go run ci/main.go --actions build
workflows:
  dagger:
    jobs:
      - build
