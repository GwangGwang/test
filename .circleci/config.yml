version: 2.1
jobs:
  build:
    docker:
      - image: circleci/golang:1.16
    steps:      
      - setup_remote_docker:
          version: 20.10.24
          docker_layer_caching: true
      - checkout
      - run:
          name: build templates
          command: make build-templates
          working_directory: ./test/ci
      - run: docker version
      - run: docker build --help

      - run: |
          ssh remote-docker \<<EOF
            sudo bash -c 'echo "{\"experimental\": true}" > /etc/docker/daemon.json'
            sudo systemctl restart docker
            sudo docker info
          EOF
      - run: |
          export DOCKER_CLI_EXPERIMENTAL=enabled
          docker buildx version
      
      - run:
          name: buildx setup
          command: |
            export DOCKER_BUILDKIT=1
            docker build --platform=local -o . git://github.com/docker/buildx
            mkdir -p ~/.docker/cli-plugins
            mv buildx ~/.docker/cli-plugins/docker-buildx


      - run:
          name: docker build
          command: make build-events-image-dev
          
  test:
    docker:
      - image: circleci/golang:1.16
    steps:
      - run:
          name: file exists
          command: cat /tmp/ci/test
      - run:
          name: echo path
          command: echo $PATH
                
  
workflows:
  test:
    jobs:
      - build:
          context:
            - shared
      - hold-test:
          type: approval
          requires:
            - build      
      - test:
          requires:
            - hold-test
          context:
            - shared
